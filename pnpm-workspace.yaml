# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Package versions must have been published for at least 1 day (1440 minutes)
# before pnpm will install them. This buffers against short-lived malicious releases.
#
# To temporarily allow a package before the window, add it to
# `minimumReleaseAgeExclude` and remove the exclusion once the window has passed.
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.3.4
  '@tanstack/react-query': ^5.106.1
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.2.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.4
  framer-motion: ^14.10.0
  lucide-react: ^1.70.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.4
  tsx: ^4.23.15
  vite: ^8.3.6
  vitest: ^5.1.0
  wouter: ^3.13.0
  zod: ^4.6.7

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit uses esbuild internally on an older version that's vulnerable
  '@esbuild-kit/esm-loader': 'npm:tsx@^4.21.0'
  esbuild: '0.27.3'
